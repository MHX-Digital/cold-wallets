name: Feature request
description: Propose a scoped change without weakening safety boundaries.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and trust-boundary impact
      description: Identify new dependencies, network access, secret handling, and failure modes.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Acceptance tests
      description: Use public vectors, mocks, or synthetic fixtures only.
    validations:
      required: true
  - type: checkboxes
    id: classification
    attributes:
      label: Project status
      options:
        - label: I understand the project remains experimental and NO-GO for real funds.
          required: true
