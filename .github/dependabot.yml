version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    reviewers:
      - neomaike
    labels:
      - dependencies
      - security
    commit-message:
      prefix: build(deps)
    groups:
      python-runtime:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    reviewers:
      - neomaike
    labels:
      - dependencies
      - security
    commit-message:
      prefix: ci
